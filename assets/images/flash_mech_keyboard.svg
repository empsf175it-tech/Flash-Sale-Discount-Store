<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">

  <defs>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-spotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1735" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0E101A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#8B2DF5" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34384A" />
      <stop offset="50%" stop-color="#1C1F2B" />
      <stop offset="100%" stop-color="#12141D" />
    </linearGradient>
    <linearGradient id="metal-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697184" />
      <stop offset="50%" stop-color="#3F4658" />
      <stop offset="100%" stop-color="#232733" />
    </linearGradient>
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252B3B" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg-spotlight)" rx="20"/>
  <rect width="500" height="500" fill="url(#grid-dots)" rx="20"/>
  
  <!-- Ambient Desk Glow -->
  <ellipse cx="250" cy="270" rx="200" ry="90" fill="url(#neon-cyan)" opacity="0.15" filter="url(#glow-cyan)"/>
  
  <!-- Keyboard Chassis (Isometric angled) -->
  <g transform="translate(250, 250) rotate(-6)">
    <!-- Base Plate -->
    <rect x="-180" y="-80" width="360" height="160" rx="14" fill="#10121C" stroke="#252A3C" stroke-width="3"/>
    <rect x="-174" y="-74" width="348" height="148" rx="10" fill="#171A26"/>

    <!-- Key Matrix Grid -->
    <g fill="#202434" stroke="#2E344A" stroke-width="1.5">
      <rect x="-160" y="-62" width="22" height="18" rx="4" fill="#FF1A53"/>
      <rect x="-132" y="-62" width="20" height="18" rx="4"/>
      <rect x="-106" y="-62" width="20" height="18" rx="4"/>
      <rect x="-80" y="-62" width="20" height="18" rx="4"/>
      <rect x="-54" y="-62" width="20" height="18" rx="4"/>
      <rect x="-28" y="-62" width="20" height="18" rx="4"/>
      <rect x="-2" y="-62" width="20" height="18" rx="4"/>
      <rect x="24" y="-62" width="20" height="18" rx="4"/>
      <rect x="50" y="-62" width="20" height="18" rx="4"/>
      <rect x="76" y="-62" width="20" height="18" rx="4"/>
      <rect x="102" y="-62" width="20" height="18" rx="4"/>
      <rect x="128" y="-62" width="32" height="18" rx="4" fill="#8B2DF5"/>

      <!-- Row 2 -->
      <rect x="-160" y="-38" width="28" height="18" rx="4"/>
      <rect x="-126" y="-38" width="20" height="18" rx="4"/>
      <rect x="-100" y="-38" width="20" height="18" rx="4"/>
      <rect x="-74" y="-38" width="20" height="18" rx="4"/>
      <rect x="-48" y="-38" width="20" height="18" rx="4"/>
      <rect x="-22" y="-38" width="20" height="18" rx="4"/>
      <rect x="4" y="-38" width="20" height="18" rx="4"/>
      <rect x="30" y="-38" width="20" height="18" rx="4"/>
      <rect x="56" y="-38" width="20" height="18" rx="4"/>
      <rect x="82" y="-38" width="20" height="18" rx="4"/>
      <rect x="108" y="-38" width="20" height="18" rx="4"/>
      <rect x="134" y="-38" width="26" height="18" rx="4"/>

      <!-- Row 3 (WASD accented) -->
      <rect x="-160" y="-14" width="34" height="18" rx="4"/>
      <rect x="-120" y="-14" width="20" height="18" rx="4" fill="#00F2FE"/>
      <rect x="-94" y="-14" width="20" height="18" rx="4" fill="#00F2FE"/>
      <rect x="-68" y="-14" width="20" height="18" rx="4" fill="#00F2FE"/>
      <rect x="-42" y="-14" width="20" height="18" rx="4"/>
      <rect x="-16" y="-14" width="20" height="18" rx="4"/>
      <rect x="10" y="-14" width="20" height="18" rx="4"/>
      <rect x="36" y="-14" width="20" height="18" rx="4"/>
      <rect x="62" y="-14" width="20" height="18" rx="4"/>
      <rect x="88" y="-14" width="20" height="18" rx="4"/>
      <rect x="114" y="-14" width="46" height="18" rx="4" fill="#FF6B00"/>

      <!-- Row 4 Spacebar row -->
      <rect x="-160" y="10" width="40" height="18" rx="4"/>
      <rect x="-114" y="10" width="24" height="18" rx="4"/>
      <rect x="-84" y="10" width="130" height="18" rx="4" fill="url(#grad-cyber)"/>
      <rect x="52" y="10" width="24" height="18" rx="4"/>
      <rect x="82" y="10" width="24" height="18" rx="4"/>
      <rect x="112" y="10" width="48" height="18" rx="4"/>
    </g>

    <!-- Rotary Volume Dial -->
    <circle cx="150" cy="-62" r="9" fill="#10121C" stroke="#00FFA3" stroke-width="2" filter="url(#glow-cyan)"/>
  </g>

  <!-- Underglow Edge -->
  <line x1="90" y1="340" x2="410" y2="305" stroke="#00F2FE" stroke-width="3" filter="url(#glow-cyan)"/>

  <rect x="175" y="420" width="150" height="30" rx="15" fill="#121522" stroke="#00F2FE" stroke-width="1"/>
  <text x="250" y="440" fill="#00F2FE" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">HOT-SWAP RGB 8000Hz</text>
</svg>