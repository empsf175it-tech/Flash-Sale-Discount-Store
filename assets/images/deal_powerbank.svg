<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">

  <defs>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-spotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1735" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0E101A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#8B2DF5" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34384A" />
      <stop offset="50%" stop-color="#1C1F2B" />
      <stop offset="100%" stop-color="#12141D" />
    </linearGradient>
    <linearGradient id="metal-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697184" />
      <stop offset="50%" stop-color="#3F4658" />
      <stop offset="100%" stop-color="#232733" />
    </linearGradient>
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252B3B" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg-spotlight)" rx="20"/>
  <rect width="500" height="500" fill="url(#grid-dots)" rx="20"/>

  <g transform="translate(250, 240)">
    <rect x="-80" y="-140" width="160" height="280" rx="22" fill="#111420" stroke="#373E56" stroke-width="3"/>
    <rect x="-72" y="-132" width="144" height="264" rx="16" fill="#171C2B" opacity="0.7"/>
    <circle cx="0" cy="-30" r="44" fill="none" stroke="#FF6B00" stroke-width="7" opacity="0.8"/>
    <circle cx="0" cy="-30" r="30" fill="none" stroke="#FF1A53" stroke-width="3" filter="url(#glow-crimson)"/>

    <g stroke="#00FFA3" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M -50 50 L -30 50 L -10 70 L 40 70"/>
      <path d="M -50 80 L 10 80 L 30 100 L 50 100"/>
      <circle cx="40" cy="70" r="3" fill="#00FFA3"/>
      <circle cx="50" cy="100" r="3" fill="#00FFA3"/>
    </g>

    <rect x="-60" y="-115" width="120" height="42" rx="8" fill="#090B12" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="0" y="-95" fill="#00F2FE" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle" filter="url(#glow-cyan)">140W FAST</text>
    <text x="0" y="-81" fill="#FFE600" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">⚡ 27,000 mAh • 100%</text>

    <rect x="-40" y="125" width="26" height="8" rx="2" fill="#090B12" stroke="#4A526A" stroke-width="1"/>
    <rect x="14" y="125" width="26" height="8" rx="2" fill="#090B12" stroke="#4A526A" stroke-width="1"/>
  </g>
</svg>