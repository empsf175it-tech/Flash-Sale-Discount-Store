<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">

  <defs>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-spotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1735" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0E101A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#8B2DF5" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34384A" />
      <stop offset="50%" stop-color="#1C1F2B" />
      <stop offset="100%" stop-color="#12141D" />
    </linearGradient>
    <linearGradient id="metal-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697184" />
      <stop offset="50%" stop-color="#3F4658" />
      <stop offset="100%" stop-color="#232733" />
    </linearGradient>
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252B3B" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg-spotlight)" rx="20"/>
  <rect width="500" height="500" fill="url(#grid-dots)" rx="20"/>

  <g transform="translate(250, 240) rotate(-15)">
    <ellipse cx="0" cy="0" rx="120" ry="70" fill="none" stroke="url(#metal-titanium)" stroke-width="36"/>
    <ellipse cx="0" cy="0" rx="100" ry="54" fill="none" stroke="#0D0F18" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="120" ry="70" fill="none" stroke="#00FFA3" stroke-width="3" stroke-dasharray="140 180" filter="url(#glow-cyan)"/>
    <circle cx="60" cy="-35" r="5" fill="#FF1A53" filter="url(#glow-crimson)"/>
    <circle cx="40" cy="-45" r="5" fill="#00FFA3" filter="url(#glow-cyan)"/>
  </g>

  <rect x="175" y="420" width="150" height="30" rx="15" fill="#121522" stroke="#00FFA3" stroke-width="1"/>
  <text x="250" y="440" fill="#00FFA3" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">TITANIUM SLEEP &amp; VITALS</text>
</svg>