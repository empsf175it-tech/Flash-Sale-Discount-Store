<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">

  <defs>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-spotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1735" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0E101A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#8B2DF5" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34384A" />
      <stop offset="50%" stop-color="#1C1F2B" />
      <stop offset="100%" stop-color="#12141D" />
    </linearGradient>
    <linearGradient id="metal-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697184" />
      <stop offset="50%" stop-color="#3F4658" />
      <stop offset="100%" stop-color="#232733" />
    </linearGradient>
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252B3B" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg-spotlight)" rx="20"/>
  <rect width="500" height="500" fill="url(#grid-dots)" rx="20"/>

  <!-- Mouse Silhouette -->
  <g transform="translate(250, 245)">
    <!-- Base Glow -->
    <ellipse cx="0" cy="20" rx="90" ry="130" fill="url(#neon-lime)" opacity="0.1" filter="url(#glow-cyan)"/>
    
    <!-- Body Chassis -->
    <path d="M 0 -130 C 50 -130, 80 -60, 80 40 C 80 120, 50 140, 0 140 C -50 140, -80 120, -80 40 C -80 -60, -50 -130, 0 -130 Z" fill="url(#metal-dark)" stroke="#2D3349" stroke-width="3"/>
    
    <!-- Honeycomb Pattern in Palm Area -->
    <g opacity="0.3" stroke="#00FFA3" stroke-width="1.2" fill="none">
      <polygon points="0,40 10,46 10,58 0,64 -10,58 -10,46"/>
      <polygon points="20,40 30,46 30,58 20,64 10,58 10,46"/>
      <polygon points="-20,40 -10,46 -10,58 -20,64 -30,58 -30,46"/>
      <polygon points="10,64 20,70 20,82 10,88 0,82 0,70"/>
      <polygon points="-10,64 0,70 0,82 -10,88 -20,82 -20,70"/>
      <polygon points="0,88 10,94 10,106 0,112 -10,106 -10,94"/>
    </g>

    <!-- Left / Right Click Split -->
    <path d="M 0 -130 L 0 -30" stroke="#0E101A" stroke-width="4"/>
    <path d="M -70 -20 C -20 -30, 20 -30, 70 -20" stroke="#0E101A" stroke-width="3"/>

    <!-- Glowing Scroll Wheel -->
    <rect x="-8" y="-95" width="16" height="36" rx="6" fill="#10121C" stroke="#00FFA3" stroke-width="2" filter="url(#glow-cyan)"/>
    <line x1="-5" y1="-85" x2="5" y2="-85" stroke="#00FFA3" stroke-width="1.5"/>
    <line x1="-5" y1="-75" x2="5" y2="-75" stroke="#00FFA3" stroke-width="1.5"/>

    <!-- Perimeter LED Strip -->
    <path d="M -68 30 C -68 100, -40 128, 0 128 C 40 128, 68 100, 68 30" fill="none" stroke="url(#neon-lime)" stroke-width="3" filter="url(#glow-cyan)"/>
    
    <!-- DPI Switch -->
    <rect x="-6" y="-45" width="12" height="12" rx="3" fill="#FF1A53" stroke="#FF6B00" stroke-width="1"/>
  </g>

  <rect x="175" y="420" width="150" height="30" rx="15" fill="#121522" stroke="#00FFA3" stroke-width="1"/>
  <text x="250" y="440" fill="#00FFA3" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">49G ULTRALIGHT / 26K DPI</text>
</svg>