<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">

  <defs>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-spotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1735" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0E101A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#8B2DF5" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34384A" />
      <stop offset="50%" stop-color="#1C1F2B" />
      <stop offset="100%" stop-color="#12141D" />
    </linearGradient>
    <linearGradient id="metal-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697184" />
      <stop offset="50%" stop-color="#3F4658" />
      <stop offset="100%" stop-color="#232733" />
    </linearGradient>
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252B3B" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bg-spotlight)" rx="24"/>
  <rect width="600" height="600" fill="url(#grid-dots)" rx="24"/>
  
  <!-- Ambient Backdrop Circles -->
  <circle cx="300" cy="300" r="190" fill="none" stroke="#FF1A53" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#8B2DF5" stroke-width="1" stroke-dasharray="12 16" opacity="0.25"/>
  <circle cx="300" cy="300" r="120" fill="none" stroke="#00F2FE" stroke-width="1" opacity="0.2"/>

  <!-- Soundwave Frequency Visualizer -->
  <g opacity="0.4" transform="translate(150, 480)">
    <rect x="0" y="-10" width="4" height="20" fill="#FF1A53" rx="2"/>
    <rect x="12" y="-22" width="4" height="44" fill="#FF1A53" rx="2"/>
    <rect x="24" y="-35" width="4" height="70" fill="#FF1A53" rx="2"/>
    <rect x="36" y="-18" width="4" height="36" fill="#8B2DF5" rx="2"/>
    <rect x="48" y="-40" width="4" height="80" fill="#8B2DF5" rx="2"/>
    <rect x="60" y="-60" width="4" height="120" fill="#8B2DF5" rx="2"/>
    <rect x="72" y="-30" width="4" height="60" fill="#8B2DF5" rx="2"/>
    <rect x="84" y="-75" width="4" height="150" fill="url(#grad-cyber)" rx="2"/>
    <rect x="96" y="-45" width="4" height="90" fill="#00F2FE" rx="2"/>
    <rect x="108" y="-90" width="4" height="180" fill="#00F2FE" rx="2"/>
    <rect x="120" y="-55" width="4" height="110" fill="#00F2FE" rx="2"/>
    <rect x="132" y="-30" width="4" height="60" fill="#8B2DF5" rx="2"/>
    <rect x="144" y="-70" width="4" height="140" fill="#8B2DF5" rx="2"/>
    <rect x="156" y="-40" width="4" height="80" fill="#FF1A53" rx="2"/>
    <rect x="168" y="-20" width="4" height="40" fill="#FF1A53" rx="2"/>
  </g>

  <!-- Headphones Structure -->
  <!-- Top Headband Arch -->
  <path d="M 170 300 C 170 140, 430 140, 430 300" fill="none" stroke="url(#metal-dark)" stroke-width="32" stroke-linecap="round"/>
  <path d="M 170 300 C 170 140, 430 140, 430 300" fill="none" stroke="url(#grad-cyber)" stroke-width="4" stroke-linecap="round" filter="url(#glow-violet)"/>
  
  <!-- Inner Cushion Padding -->
  <path d="M 210 240 C 210 165, 390 165, 390 240" fill="none" stroke="#12141F" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Left Ear Fork -->
  <path d="M 180 290 L 165 340 L 165 370" fill="none" stroke="url(#metal-titanium)" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Ear Fork -->
  <path d="M 420 290 L 435 340 L 435 370" fill="none" stroke="url(#metal-titanium)" stroke-width="12" stroke-linecap="round"/>

  <!-- Left Ear Cup (Angled Perspective) -->
  <g transform="translate(160, 360)">
    <ellipse cx="0" cy="0" rx="46" ry="68" fill="#131620" stroke="#252A3B" stroke-width="3"/>
    <ellipse cx="6" cy="0" rx="38" ry="58" fill="url(#metal-dark)"/>
    <ellipse cx="10" cy="0" rx="30" ry="46" fill="#0C0E14"/>
    <ellipse cx="10" cy="0" rx="22" ry="34" fill="none" stroke="url(#neon-flame)" stroke-width="3.5" filter="url(#glow-crimson)"/>
    <circle cx="10" cy="0" r="10" fill="#1D2130" stroke="#FF1A53" stroke-width="1.5"/>
    <path d="M 5 -4 L 15 4 M 15 -4 L 5 4" stroke="#00F2FE" stroke-width="2"/>
  </g>

  <!-- Right Ear Cup -->
  <g transform="translate(440, 360)">
    <ellipse cx="0" cy="0" rx="46" ry="68" fill="#131620" stroke="#252A3B" stroke-width="3"/>
    <ellipse cx="-6" cy="0" rx="38" ry="58" fill="url(#metal-dark)"/>
    <ellipse cx="-10" cy="0" rx="30" ry="46" fill="#0C0E14"/>
    <ellipse cx="-10" cy="0" rx="22" ry="34" fill="none" stroke="#00F2FE" stroke-width="3.5" filter="url(#glow-cyan)"/>
    <circle cx="-10" cy="0" r="10" fill="#1D2130" stroke="#00F2FE" stroke-width="1.5"/>
    <circle cx="-10" cy="0" r="4" fill="#00FFA3"/>
  </g>

  <!-- Floating Status Indicator Badges -->
  <g transform="translate(390, 110)">
    <rect width="130" height="34" rx="17" fill="#141824" stroke="#00F2FE" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#00FFA3" filter="url(#glow-cyan)"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">96kHz / 24-BIT</text>
  </g>

  <g transform="translate(80, 120)">
    <rect width="110" height="34" rx="17" fill="#141824" stroke="#FF1A53" stroke-width="1.2"/>
    <text x="55" y="22" fill="#FF1A53" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">⚡ ANC ACTIVE</text>
  </g>
</svg>