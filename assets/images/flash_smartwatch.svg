<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">

  <defs>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-spotlight" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1735" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0E101A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#8B2DF5" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34384A" />
      <stop offset="50%" stop-color="#1C1F2B" />
      <stop offset="100%" stop-color="#12141D" />
    </linearGradient>
    <linearGradient id="metal-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697184" />
      <stop offset="50%" stop-color="#3F4658" />
      <stop offset="100%" stop-color="#232733" />
    </linearGradient>
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neon-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252B3B" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg-spotlight)" rx="20"/>
  <rect width="500" height="500" fill="url(#grid-dots)" rx="20"/>

  <circle cx="250" cy="250" r="140" fill="none" stroke="#FF1A53" stroke-width="1" opacity="0.25"/>

  <!-- Straps -->
  <path d="M 210 60 L 290 60 L 285 160 L 215 160 Z" fill="#141724" stroke="#252B3E" stroke-width="2"/>
  <path d="M 215 340 L 285 340 L 290 440 L 210 440 Z" fill="#141724" stroke="#252B3E" stroke-width="2"/>
  <line x1="220" y1="90" x2="280" y2="90" stroke="#252B3E" stroke-width="2"/>
  <line x1="220" y1="120" x2="280" y2="120" stroke="#252B3E" stroke-width="2"/>
  <line x1="220" y1="380" x2="280" y2="380" stroke="#252B3E" stroke-width="2"/>
  <line x1="220" y1="410" x2="280" y2="410" stroke="#252B3E" stroke-width="2"/>

  <!-- Watch Chassis Outer Bezel -->
  <rect x="180" y="160" width="140" height="180" rx="34" fill="url(#metal-titanium)" stroke="#4A5266" stroke-width="3"/>
  <rect x="190" y="170" width="120" height="160" rx="26" fill="#0A0D14" stroke="#1D2232" stroke-width="2"/>

  <!-- Digital OLED Display Graphics -->
  <g transform="translate(250, 250)">
    <!-- Time -->
    <text x="0" y="-15" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-1">09:41</text>
    
    <!-- Heart Rate / Voltage Graph -->
    <path d="M -45 15 L -25 15 L -15 2 L -5 26 L 5 -5 L 15 18 L 25 15 L 45 15" fill="none" stroke="#FF1A53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-crimson)"/>
    
    <!-- Battery / Energy Arc -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#1F2538" stroke-width="4"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#00FFA3" stroke-width="4" stroke-dasharray="140 200" stroke-linecap="round" filter="url(#glow-cyan)"/>

    <!-- Metrics -->
    <text x="-25" y="44" fill="#00F2FE" font-family="'Inter', sans-serif" font-size="10" font-weight="700">142 BPM</text>
    <text x="25" y="44" fill="#FFE600" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">98%</text>
  </g>

  <!-- Crown Button -->
  <rect x="320" y="210" width="8" height="24" rx="3" fill="#697184" stroke="#FF1A53" stroke-width="1"/>
  <rect x="320" y="250" width="6" height="34" rx="2" fill="#697184"/>
</svg>