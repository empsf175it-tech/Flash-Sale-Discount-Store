<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF1A53" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Rounded container background matching brand logo-bolt style -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#flameGrad)" filter="url(#glow)" />
  <!-- Lightning bolt polygon matching brand logo mark -->
  <g transform="translate(8, 8) scale(2)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#FFFFFF" />
  </g>
</svg>
